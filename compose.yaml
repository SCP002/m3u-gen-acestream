services:
  engine:
    image: acestream-engine
    build:
      context: .
      dockerfile: Dockerfile.engine
    restart: unless-stopped
    ports:
      # 8621 is P2P node port, used to communicate to other peers.
      - "8621:8621/tcp"
      - "8621:8621/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s 'http://127.0.0.1:6878/webui/api/service?method=get_version' | jq -e '.error == null' > /dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - acestream-net

  acexy:
    image: ghcr.io/javinator9889/acexy:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - engine
    environment:
      - ACEXY_LISTEN_ADDR=:8080
      - ACEXY_HOST=engine
      - ACEXY_PORT=6878
      - ACEXY_SCHEME=http
      - ACEXY_LOG_LEVEL=info
    networks:
      - acestream-net

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - acestream-net

  gen:
    image: m3u-gen-acestream
    build:
      context: .
    restart: "no"
    # environment:
    #  - INTERVAL=6h
    depends_on:
      - acexy
    volumes:
      - ./data/config:/data/config
      - ./data/out:/data/out
    command:
      - --cfgPath
      - /data/config/m3u-gen-acestream.yaml
    networks:
      - acestream-net

networks:
  acestream-net:
    driver: bridge
