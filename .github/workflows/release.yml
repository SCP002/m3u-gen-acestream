name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Create release and upload binaries.
  id-token: write # Sign build provenance attestation.
  attestations: write # Store build provenance attestation.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check version
        run: |
          tag="$GITHUB_REF_NAME"
          build_version=$(sed -n 's/^version="\(.*\)"$/\1/p' build.sh)
          docker_version=$(sed -n 's/^ARG VERSION=//p' Dockerfile)
          ok=true
          if [[ $build_version != "$tag" ]]; then
            echo "::error file=build.sh::Tag is $tag, but version in build.sh is '$build_version'"
            ok=false
          fi
          if [[ $docker_version != "$tag" ]]; then
            echo "::error file=Dockerfile::Tag is $tag, but VERSION in Dockerfile is '$docker_version'"
            ok=false
          fi
          $ok

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: bash build.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
